name: contribution-policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contribution-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA. The tag is kept as a comment for humans.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write pull request description to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"

      - name: Check contribution policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_contributions.py "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP/pr_body.md"
