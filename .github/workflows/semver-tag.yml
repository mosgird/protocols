name: semver-tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Locked to a commit in actions.lock (see actions-lock.yml).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag name and ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_semver_tag.py "$TAG"
