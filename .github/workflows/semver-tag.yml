name: semver-tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA. The tag is kept as a comment for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag name and ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_semver_tag.py "$TAG"
