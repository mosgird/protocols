name: spec-consistency

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA. The tag is kept as a comment for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check specification consistency
        run: python3 scripts/check_spec.py
