name: spec-consistency

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-consistency:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Locked to a commit in actions.lock (see actions-lock.yml).
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check specification consistency
        run: python3 scripts/check_spec.py

      # The implementation repositories run check_test_ratio.py from a
      # pinned commit of this repository; its tests run here.
      - name: Test the scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
