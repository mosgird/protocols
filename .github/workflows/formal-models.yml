name: formal-models

# ProVerif models run on every pull request that touches the models.
# The Tamarin model takes minutes, so it runs only when it changes,
# once a week, and on demand. Neither delays unrelated pull requests.

on:
  pull_request:
    paths:
      - "spec/v0.1/models/**"
      - "scripts/check_models.py"
      - ".github/workflows/formal-models.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPAM_VERSION: "2.6.1"
  OPAM_SHA256: "b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d"
  OCAML_VERSION: "5.2.1"
  PROVERIF_VERSION: "2.05"
  TAMARIN_VERSION: "1.12.0"
  TAMARIN_SHA256: "201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6"
  MAUDE_VERSION: "3.5.1"
  MAUDE_SHA256: "72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tamarin: ${{ steps.diff.outputs.tamarin }}
    steps:
      # Locked to a commit in actions.lock (see actions-lock.yml).
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "tamarin=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(spec/v0\.1/models/tamarin/|scripts/check_models\.py|\.github/workflows/formal-models\.yml)'; then
            echo "tamarin=true" >> "$GITHUB_OUTPUT"
          else
            echo "tamarin=false" >> "$GITHUB_OUTPUT"
          fi

  proverif:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cache opam
        uses: actions/cache@v6.1.0
        with:
          path: ~/.opam
          key: opam-${{ env.OPAM_VERSION }}-ocaml-${{ env.OCAML_VERSION }}-proverif-${{ env.PROVERIF_VERSION }}
      - name: Install ProVerif
        run: |
          # ProVerif's opam package depends on lablgtk (for its optional GUI), which needs GTK 2 headers.
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk2.0-dev
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/opam" "https://github.com/ocaml/opam/releases/download/${OPAM_VERSION}/opam-${OPAM_VERSION}-x86_64-linux"
          echo "${OPAM_SHA256}  $HOME/bin/opam" | sha256sum -c -
          chmod +x "$HOME/bin/opam"
          export PATH="$HOME/bin:$PATH" OPAMYES=1
          if [ ! -x "$HOME/.opam/default/bin/proverif" ]; then
            opam init --bare --disable-sandboxing -n
            opam switch create default "ocaml-base-compiler.${OCAML_VERSION}"
            opam install "proverif.${PROVERIF_VERSION}"
          fi
          echo "$HOME/.opam/default/bin" >> "$GITHUB_PATH"
      - name: Check ProVerif models
        run: python3 scripts/check_models.py --proverif

  tamarin:
    needs: changes
    if: needs.changes.outputs.tamarin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Tamarin and Maude
        run: |
          mkdir -p "$HOME/tools/tamarin" "$HOME/tools/maude" "$HOME/bin"
          cd "$HOME/tools"
          curl -fsSL -o tamarin.tar.gz "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz"
          echo "${TAMARIN_SHA256}  tamarin.tar.gz" | sha256sum -c -
          tar -xzf tamarin.tar.gz -C tamarin
          find tamarin -type f -name tamarin-prover -exec install -m755 {} "$HOME/bin/" \;
          curl -fsSL -o maude.zip "https://github.com/maude-lang/Maude/releases/download/Maude${MAUDE_VERSION}/Maude-${MAUDE_VERSION}-linux-x86_64.zip"
          echo "${MAUDE_SHA256}  maude.zip" | sha256sum -c -
          unzip -q maude.zip -d maude
          chmod +x maude/maude
          printf '#!/bin/sh\nMAUDE_LIB=%s exec %s "$@"\n' "$HOME/tools/maude" "$HOME/tools/maude/maude" > "$HOME/bin/maude"
          chmod +x "$HOME/bin/maude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Check Tamarin model
        run: python3 scripts/check_models.py --tamarin
